<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaKbine - Transfert & Services</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; width: 100%; max-width: 420px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .operator-badge { margin-top: 5px; font-size: 13px; font-weight: bold; }
        .summary { background: #0f172a; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px dashed #475569; }
        .summary p { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary p.total { font-size: 18px; font-weight: bold; color: #38bdf8; border-top: 1px solid #334155; padding-top: 8px; margin-top: 8px; }
        .btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h1>MaKbine Transfert</h1>
    
    <div class="form-group">
        <label>Numéro du destinataire</label>
        <input type="tel" id="phone" placeholder="Ex: 0799313774" maxlength="10" oninput="detectOperator(this.value)">
        <div id="operator" class="operator-badge" style="color: #64748b;">En attente du numéro...</div>
    </div>

    <div class="form-group">
        <label>Type de Service</label>
        <select id="service">
            <option value="transfert">Transfert d'unités / Argent</option>
            <option value="pass_internet">Pass Internet</option>
            <option value="pass_appel">Pass Appel</option>
        </select>
    </div>

    <div class="form-group">
        <label>Montant de base (FCFA)</label>
        <input type="number" id="amount" placeholder="Ex: 1000" oninput="calculateTotal()">
    </div>

    <div class="summary">
        <p><span>Montant initial :</span> <span id="lblBase">0 FCFA</span></p>
        <p><span>Frais de service (7%) :</span> <span id="lblFees">0 FCFA</span></p>
        <p class="total"><span>Total à payer :</span> <span id="lblTotal">0 FCFA</span></p>
    </div>

    <button class="btn" onclick="validateTransaction()">Valider la transaction</button>
</div>

<script>
    function detectOperator(phone) {
        const opDiv = document.getElementById('operator');
        if (phone.length < 2) {
            opDiv.innerText = "En attente du numéro...";
            opDiv.style.color = "#64748b";
            return;
        }
        const prefix = phone.substring(0, 2);
        if (["07", "08", "09"].includes(prefix)) {
            opDiv.innerText = "🟢 Opérateur : ORANGE CI";
            opDiv.style.color = "#c084fc";
        } else if (["05", "06"].includes(prefix)) {
            opDiv.innerText = "🟡 Opérateur : MTN CI";
            opDiv.style.color = "#facc15";
        } else if (["01", "02", "03"].includes(prefix)) {
            opDiv.innerText = "🔵 Opérateur : MOOV CI";
            opDiv.style.color = "#4ade80";
        } else {
            opDiv.innerText = "❌ Préfixe non reconnu";
            opDiv.style.color = "#f87171";
        }
    }

    function calculateTotal() {
        const amountVal = parseFloat(document.getElementById('amount').value) || 0;
        const fees = amountVal * 0.07;
        const total = amountVal + fees;

        document.getElementById('lblBase').innerText = amountVal + " FCFA";
        document.getElementById('lblFees').innerText = fees.toFixed(0) + " FCFA";
        document.getElementById('lblTotal').innerText = total.toFixed(0) + " FCFA";
    }

    function validateTransaction() {
        const phone = document.getElementById('phone').value;
        const total = document.getElementById('lblTotal').innerText;
        if(!phone || phone.length < 10) {
            alert("Veuillez entrer un numéro valide.");
            return;
        }
        alert(`Transaction initiée vers ${phone} pour un montant total de ${total}.`);
    }
</script>

</body>
</html>
