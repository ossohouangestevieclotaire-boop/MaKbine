<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaKbine - Plateforme de Transfert</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        .switch { text-align: center; margin-top: 15px; font-size: 13px; color: #94a3b8; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- SECTION AUTHENTIFICATION -->
    <div id="auth-section">
        <h2 id="auth-title">Connexion</h2>
        <form id="auth-form">
            <div class="form-group" id="group-email">
                <label>Adresse e-mail</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label>Numéro de téléphone</label>
                <input type="text" id="phone" placeholder="07XXXXXXXX" required>
            </div>
            <div class="form-group" id="group-password">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="auth-btn">Se connecter</button>
        </form>
        <div class="switch" id="switch-to-register" onclick="toggleMode('register')">Créer un compte</div>
        <div class="switch" id="switch-to-forgot" onclick="toggleMode('forgot')" style="margin-top: 5px; color: #38bdf8;">Mot de passe oublié ?</div>
    </div>

    <!-- SECTION TABLEAU DE BORD / TRANSACTION -->
    <div id="dashboard-section" class="hidden">
        <h2>MaKbine - Transaction</h2>
        <p>Solde actuel : <span id="solde-actuel" style="color: #4ade80; font-weight: bold;">45,500 FCFA</span></p>
        
        <div class="form-group">
            <label>Moyen de paiement</label>
            <select id="payment-method">
                <option value="Orange Money">Orange Money</option>
                <option value="Wave">Wave</option>
            </select>
        </div>

        <div class="form-group">
            <label>Type de service</label>
            <input type="text" value="Transfert d'unité" disabled style="background: #334155; color: #cbd5e1;">
        </div>

        <div class="form-group">
            <label>Numéro du destinataire</label>
            <input type="text" id="dest-phone" placeholder="Numéro du client">
        </div>

        <div class="form-group">
            <label>Montant (FCFA)</label>
            <input type="number" id="amount" placeholder="Ex: 1000">
        </div>

        <button onclick="validerTransaction()">Valider la transaction</button>
        <button onclick="logout()" style="background: #ef4444; margin-top: 10px;">Se déconnecter</button>
    </div>
</div>

<script>
    let mode = 'login'; // login, register, forgot

    function toggleMode(targetMode) {
        mode = targetMode;
        const title = document.getElementById('auth-title');
        const btn = document.getElementById('auth-btn');
        const groupEmail = document.getElementById('group-email');
        const groupPassword = document.getElementById('group-password');
        const switchText = document.getElementById('switch-to-register');
        const forgotText = document.getElementById('switch-to-forgot');

        if (mode === 'register') {
            title.innerText = "Inscription";
            btn.innerText = "S'inscrire";
            groupEmail.classList.remove('hidden');
            groupPassword.classList.remove('hidden');
            switchText.innerText = "Déjà un compte ? Se connecter";
            forgotText.classList.add('hidden');
        } else if (mode === 'login') {
            title.innerText = "Connexion";
            btn.innerText = "Se connecter";
            groupEmail.classList.remove('hidden');
            groupPassword.classList.remove('hidden');
            switchText.innerText = "Créer un compte";
            forgotText.classList.remove('hidden');
        } else if (mode === 'forgot') {
            title.innerText = "Récupération";
            btn.innerText = "Envoyer le lien par e-mail";
            groupEmail.classList.remove('hidden');
            groupPassword.classList.add('hidden');
            switchText.innerText = "Retour à la connexion";
            forgotText.classList.add('hidden');
        }
    }

    document.getElementById('auth-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        
        if (mode === 'forgot') {
            alert("Un lien de réinitialisation a été envoyé à : " + email);
            toggleMode('login');
            return;
        }

        // Simulation de connexion/inscription réussie -> Affichage du dashboard
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
    });

    function logout() {
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
    }

    async function validerTransaction() {
        const phone = document.getElementById('dest-phone').value;
        const amount = document.getElementById('amount').value;
        const method = document.getElementById('payment-method').value;

        if(!phone || !amount) {
            alert("Veuillez remplir tous les champs");
            return;
        }

        const transactionData = {
            phone: phone,
            total: amount + " FCFA",
            paymentMethod: method
        };

        // Envoi vers l'API Vercel
        try {
            let response = await fetch('/api/transacter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(transactionData)
            });
            alert("Succès ! Transaction enregistrée.");
        } catch (err) {
            alert("Erreur de communication avec le serveur.");
        }
    }
</script>

</body>
</html>
