<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance en cours</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px rgba(255, 255, 255, 0.1) solid;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 25px;
        }

        .btn-contact {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-contact:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Icône animée (vous pouvez la remplacer par votre logo <img>) -->
        <div class="icon">🛠️</div>
        
        <div class="status-badge">Mise à jour du système</div>
        
        <h1>Maintenance en cours</h1>
        
        <p>
            Notre site web est actuellement en cours d'optimisation afin de vous offrir une meilleure expérience de service. 
            Nous serons de retour d'ici quelques instants. Merci pour votre patience !
        </p>

        <!-- Bouton d'action pour garder le contact (remplacez le lien ou l'email) -->
        <a href="mailto:support@votresite.com" class="btn-contact">Contacter le support</a>
    </div>

</body>
</html>
