<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabine Express</title>
    <!-- CSS inchangé pour garder votre style -->
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent: #f97316; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); min-height: 90vh; box-sizing: border-box; }
        .form-section { background: #0f172a; border: 1px solid var(--border); padding: 15px; border-radius: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); }
        .btn-main { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="form-view">
        <h3 style="color: var(--accent);">Cabine Express</h3>
        
        <div class="form-group">
            <label>Numéro du bénéficiaire</label>
            <!-- L'appel à updateForfaits est crucial ici -->
            <input type="text" id="dest-phone" placeholder="Ex: 0700000000" maxlength="10" oninput="updateForfaits()">
        </div>

        <div class="form-group">
            <label>Service</label>
            <select id="service-select" onchange="updateForfaits()">
                <option value="Transfert d'unités">Transfert d'unités</option>
                <option value="Souscription Internet">Souscription Internet</option>
                <option value="Souscription Appel">Souscription Appel</option>
                <option value="Souscription Mix">Souscription Mix</option>
            </select>
        </div>

        <div class="form-group">
            <label>Forfaits disponibles</label>
            <select id="amount-select"></select>
        </div>
    </div>
</div>

<script>
    // Catalogue dynamique par opérateur
    const forfaits = {
        'ORANGE': {
            'Transfert d\'unités': [{label: '100 FCFA', value: 100}, {label: '500 FCFA', value: 500}],
            'Souscription Internet': [{label: 'Pass Orange Net 1Go - 500F', value: 500}],
            'Souscription Appel': [{label: 'Pass Appel Orange - 200F', value: 200}],
            'Souscription Mix': [{label: 'Mix Orange - 1000F', value: 1000}]
        },
        'MTN': {
            'Transfert d\'unités': [{label: '200 FCFA', value: 200}],
            'Souscription Internet': [{label: 'Pass MTN Giga - 600F', value: 600}],
            'Souscription Appel': [{label: 'Pass Appel MTN - 300F', value: 300}],
            'Souscription Mix': [{label: 'Mix MTN - 1200F', value: 1200}]
        },
        'MOOV': {
            'Transfert d\'unités': [{label: '500 FCFA', value: 500}],
            'Souscription Internet': [{label: 'Pass Moov Surf - 400F', value: 400}],
            'Souscription Appel': [{label: 'Pass Appel Moov - 250F', value: 250}],
            'Souscription Mix': [{label: 'Mix Moov - 800F', value: 800}]
        }
    };

    function getOperator(phone) {
        if (phone.startsWith('07')) return 'ORANGE';
        if (phone.startsWith('05')) return 'MTN';
        if (phone.startsWith('01')) return 'MOOV';
        return null;
    }

    function updateForfaits() {
        const phone = document.getElementById('dest-phone').value;
        const service = document.getElementById('service-select').value;
        const select = document.getElementById('amount-select');
        
        select.innerHTML = '';
        
        const operator = getOperator(phone);
        
        if (operator && forfaits[operator][service]) {
            forfaits[operator][service].forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.value;
                opt.textContent = f.label;
                select.appendChild(opt);
            });
        } else {
            const opt = document.createElement('option');
            opt.textContent = "Entrez un numéro valide (01, 05, 07)";
            select.appendChild(opt);
        }
    }
</script>

</body>
</html>
