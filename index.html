<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabine Express - Achat de Forfaits</title>
    <!-- Tailwind CSS pour un design moderne et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK JavaScript Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">Cabine Express</h1>
            <p class="text-sm text-gray-500">Commandez vos forfaits en toute simplicité</p>
        </div>

        <form id="orderForm" class="space-y-4">
            <!-- Numéro du client -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Votre numéro de téléphone</label>
                <input type="tel" id="user_phone" required placeholder="Ex: 0700000000" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Opérateur -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Opérateur</label>
                <select id="service" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Sélectionnez un opérateur</option>
                    <option value="MTN">MTN</option>
                    <option value="ORANGE">Orange</option>
                    <option value="MOOV">Moov</option>
                </select>
            </div>

            <!-- Nom du forfait -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nom du forfait / Offre</label>
                <input type="text" id="package_name" required placeholder="Ex: Pass 5Go Yelou" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Numéro destinataire -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Numéro du destinataire (si différent)</label>
                <input type="tel" id="dest_phone" placeholder="Ex: 0500000000" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Montant -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Montant (FCFA)</label>
                <input type="number" id="total" required placeholder="Ex: 1000" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Bouton de validation -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200">
                Valider la commande
            </button>
        </form>

        <!-- Zone de message d'état -->
        <div id="responseMessage" class="hidden text-center text-sm p-3 rounded-lg"></div>
    </div>

    <!-- Script d'initialisation et d'envoi -->
    <script>
        // Remplacez ces valeurs par vos véritables identifiants Supabase
        const SUPABASE_URL = 'VOTRE_URL_SUPABASE';
        const SUPABASE_ANON_KEY = 'VOTRE_CLE_ANON_SUPABASE';

        // Initialisation du client Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const orderForm = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const responseMessage = document.getElementById('responseMessage');

        orderForm.addEventListener('submit async', async (e) => {}); // placeholder structure block

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'En cours...';
            responseMessage.classList.add('hidden');

            const user_phone = document.getElementById('user_phone').value;
            const service = document.getElementById('service').value;
            const package_name = document.getElementById('package_name').value;
            const dest_phone = document.getElementById('dest_phone').value || user_phone;
            const total = parseFloat(document.getElementById('total').value);

            try {
                // Insertion des données dans la table Supabase (ex: 'orders')
                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([
                        { 
                            user_phone, 
                            service, 
                            package_name, 
                            dest_phone, 
                            total, 
                            status: 'En attente' 
                        }
                    ]);

                if (error) throw error;

                // Appel optionnel de votre endpoint Vercel pour notifier Telegram (si configuré)
                try {
                    await fetch('/api/webhook', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'INSERT',
                            record: { user_phone, service, package_name, dest_phone, total, status: 'En attente' }
                        })
                    });
                } catch (webhookErr) {
                    console.warn('Alerte webhook non transmise, mais commande enregistrée.', webhookErr);
                }

                responseMessage.textContent = 'Commande enregistrée avec succès !';
                responseMessage.className = 'text-center text-sm p-3 rounded-lg bg-green-100 text-green-700 block';
                orderForm.reset();

            } catch (err) {
                console.error('Erreur:', err.message);
                responseMessage.textContent = 'Erreur lors de l’enregistrement : ' + err.message;
                responseMessage.className = 'text-center text-sm p-3 rounded-lg bg-red-100 text-red-700 block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Valider la commande';
            }
        });
    </script>
</body>
</html>
