    function filtrerForfaits() {
        const opSelect = document.getElementById('operatorSelect').value;
        const forfaitSelect = document.getElementById('forfaitSelect');
        
        // Vider la liste
        forfaitSelect.innerHTML = '<option value="">-- Choisir un forfait --</option>';

        if (!opSelect) return;

        // Filtrer selon l'opérateur choisi
        const filtres = catalogueForfaits.filter(f => f.operator === opSelect);

        filtres.forEach((f, index) => {
            const option = document.createElement('option');
            option.value = index; 
            option.textContent = `${f.name} - ${f.price}F (${f.duration})`;
            option.dataset.code = f.code;
            option.dataset.name = f.name;
            option.dataset.price = f.price;
            option.dataset.operator = f.operator;
            forfaitSelect.appendChild(option);
        });
    }

    async function validerEtPayer() {
        const opSelect = document.getElementById('operatorSelect').value;
        const forfaitSelect = document.getElementById('forfaitSelect');
        const destPhone = document.getElementById('destPhone').value;

        if (!opSelect || forfaitSelect.value === "" || !destPhone) {
            alert("Veuillez remplir tous les champs !");
            return;
        }

        const selectedOption = forfaitSelect.options[forfaitSelect.selectedIndex];
        
        const forfaitData = {
            operator: selectedOption.dataset.operator,
            code: selectedOption.dataset.code, 
            name: selectedOption.dataset.name,
            price: parseFloat(selectedOption.dataset.price)
        };

        const frais = forfaitData.price * 0.05;
        const total = forfaitData.price + frais;

        const nouvelleTransaction = {
            dest_phone: destPhone,
            service: forfaitData.operator,
            package_name: forfaitData.name,
            package_code: forfaitData.code, 
            amount: forfaitData.price,
            fees: frais,
            total: total,
            operator: forfaitData.operator,
            status: 'En attente'
        };

        console.log("Données prêtes pour Supabase :", nouvelleTransaction);
        alert(`Commande enregistrée !\nCode technique : ${forfaitData.code}\nMontant total : ${total} FCFA`);
