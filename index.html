<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabine Express - MaKbine</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h2 {
            color: #F97316;
            margin: 0;
        }
        .btn-history {
            background: #334155;
            color: #FFF;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .account-box {
            background: #1E293B;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .account-box span strong {
            color: #F97316;
        }
        .btn-quit {
            background: transparent;
            color: #EF4444;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: #1E293B;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin-top: 0;
            color: #F97316;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #94A3B8;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0F172A;
            border: 1px solid #334155;
            color: #FFF;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn-self {
            background: #334155;
            color: #F8FAFC;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            height: 45px;
        }
        .info-box {
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 12px;
            background: #0F172A;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 14px;
        }
        .info-total {
            color: #F97316;
            margin-top: 5px;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #F97316;
            color: #FFF;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        pre {
            margin-top: 20px;
            padding: 15px;
            background: #020617;
            color: #4ADE80;
            border-radius: 6px;
            white-space: pre-wrap;
            font-size: 13px;
            border: 1px solid #334155;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Cabine Express</h2>
        <button class="btn-history">Historique</button>
    </div>

    <div class="account-box">
        <span>Compte : <strong id="account-number">0100483015</strong></span>
        <button class="btn-quit">Quitter</button>
    </div>

    <div class="card">
        <h3>Souscription Internet</h3>
        
        <label>Numéro du bénéficiaire</label>
        <div class="input-group">
            <input type="text" id="phone-input" value="0100483015" placeholder="07xxxxxxxx">
            <button class="btn-self" id="btn-for-me">Pour moi</button>
        </div>

        <label>Catégorie de Forfait</label>
        <select id="category-select">
            <optgroup label="--- MOOV CI ---">
                <option value="forfaitsInternetMoov" selected>Pass Moov Surf & Internet</option>
                <option value="moovFoliePro">Moov Folie Pro</option>
                <option value="moovFolieAppels">Moov Folie Appels</option>
                <option value="izyMixPlus">Forfaits Izy Mix Plus</option>
                <option value="forfaitsSpeciauxEtIllimites">Forfaits Spéciaux & Illimités Moov</option>
                <option value="gbesseEtMoov20Ans">Gbêssê & Moov 20 ans</option>
            </optgroup>
            <optgroup label="--- MTN CI ---">
                <option value="mtnInternet">Forfaits Internet MTN</option>
                <option value="mtnKouman">MTN Kouman (Appels)</option>
                <option value="mtnYello">MTN Yello Maxi</option>
            </optgroup>
        </select>

        <label>Choisir le forfait</label>
        <select id="offer-select"></select>

        <label>Moyen de paiement</label>
        <select id="payment-select">
            <option value="Wave">Wave</option>
            <option value="Moov Money">Moov Money</option>
            <option value="MTN Momo">MTN Momo</option>
            <option value="Orange Money">Orange Money</option>
        </select>

        <div class="info-box">
            <div id="info-title">Forfait : <strong>Pass Moov Surf - 400F</strong></div>
            <div id="info-validity">Validité : 1 Jour</div>
            <div class="info-total" id="info-total">Total à payer (avec 7% de frais) : <strong>428.00 FCFA</strong></div>
        </div>

        <button class="btn-submit" id="submit-btn">Continuer</button>
    </div>

    <pre id="summary-pre"></pre>
</div>

<script>

      ],
      gbesseEtMoov20Ans: [
        { id: "gbe_1", title: "120 min Tous Réseaux + Illimité 5 FAF (Gbêssê)", price: 500, validity: "5 Jours" },
        { id: "gbe_2", title: "55 min + 300 Mo + 5 Numéros Gratuits + 250 SMS (Gbêssê)", price: 500, validity: "5 Jours" },
        { id: "gbe_3", title: "1 Go + 1 Heure (Gbêssê)", price: 500, validity: "2 Jours" },
        { id: "gbe_4", title: "1,5 Go (Gbêssê)", price: 500, validity: "3 Jours" },
        { id: "moov20_1", title: "5 000 points (Forfait Point - Moov 20 ans)", price: 500, validity: "Jusqu'au 31 Octobre 2026" },
        { id: "moov20_2", title: "1,5 Go (Moov 20 ans)", price: 500, validity: "3 Jours" },
        { id: "moov20_3", title: "20 Go + 200 min + 200 SMS (Folie 20 ans)", price: 1000, validity: "2 Jours" }
      ],
      mtnKouman: [
        { id: "mtn_k_1", title: "MTN Kouman - 30 min vers tous les réseaux", price: 300, validity: "1 Jour" },
        { id: "mtn_k_2", title: "MTN Kouman - 80 min vers tous les réseaux", price: 500, validity: "3 Jours" },
        { id: "mtn_k_3", title: "MTN Kouman - 200 min vers tous les réseaux", price: 1000, validity: "7 Jours" }
      ],
      mtnInternet: [
        { id: "mtn_net_1", title: "MTN Internet - 1 Go", price: 600, validity: "1 Jour" },
        { id: "mtn_net_2", title: "MTN Internet - 2 Go", price: 1000, validity: "2 Jours" },
        { id: "mtn_net_3", title: "MTN Internet - 5 Go", price: 2500, validity: "7 Jours" },
        { id: "mtn_net_4", title: "MTN Internet - 15 Go", price: 5000, validity: "30 Jours" },
        { id: "mtn_net_5", title: "MTN Internet - 35 Go", price: 10000, validity: "30 Jours" }
      ],
      mtnYello: [
        { id: "mtn_y_1", title: "MTN Yello Maxi - 3 Go + Appels Illimités MTN", price: 2000, validity: "7 Jours" },
        { id: "mtn_y_2", title: "MTN Yello Maxi - 10 Go + Appels Illimités MTN", price: 5000, validity: "30 Jours" }
      ]
    };

    const phoneInput = document.getElementById('phone-input');
    const btnForMe = document.getElementById('btn-for-me');
    const categorySelect = document.getElementById('category-select');
    const offerSelect = document.getElementById('offer-select');
    const paymentSelect = document.getElementById('payment-select');
    
    const infoTitle = document.getElementById('info-title');
    const infoValidity = document.getElementById('info-validity');
    const infoTotal = document.getElementById('info-total');
    const submitBtn = document.getElementById('submit-btn');
    const summaryPre = document.getElementById('summary-pre');

    function updateOffers() {
        const cat = categorySelect.value;
        const offers = offersDatabase[cat] || [];
        offerSelect.innerHTML = '';
        offers.forEach(offer => {
            const opt = document.createElement('option');
            opt.value = offer.id;
            opt.textContent = `${offer.title} (${offer.price} FCFA)`;
            offerSelect.appendChild(opt);
        });
        updateDetails();
    }

    function getCurrentOffer() {
        const cat = categorySelect.value;
        const offers = offersDatabase[cat] || [];
        const offerId = offerSelect.value;
        return offers.find(o => o.id === offerId) || offers[0];
    }

    function updateDetails() {
        const offer = getCurrentOffer();
        if (!offer) return;
        const total = offer.price + (offer.price * 0.07);
        infoTitle.innerHTML = `Forfait : <strong>${offer.title}</strong>`;
        infoValidity.textContent = `Validité : ${offer.validity}`;
        infoTotal.innerHTML = `Total à payer (avec 7% de frais) : <strong>${total.toFixed(2)} FCFA</strong>`;
    }

    categorySelect.addEventListener('change', updateOffers);
    offerSelect.addEventListener('change', updateDetails);

    btnForMe.addEventListener('click', () => {
        phoneInput.value = '0100483015';
    });

    submitBtn.addEventListener('click', async () => {
        const phone = phoneInput.value;
        const offer = getCurrentOffer();
        const paymentMethod = paymentSelect.value;

        if (!phone || !offer) {
            alert("Veuillez remplir tous les champs correctement.");
            return;
        }

        const total = offer.price + (offer.price * 0.07);
        submitBtn.disabled = true;
        submitBtn.textContent = "Traitement en cours...";

        try {
            const response = await fetch('/api/transacter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone, 
                    offer,
                    total,
                    paymentMethod,
                    token: MAKBINE_CONFIG.token
                })
            });

            if (response.ok) {
                showSummary(phone, offer, paymentMethod, total);
            } else {
                alert("Erreur lors de la transaction.");
            }
        } catch (error) {
            // Mode simulation si pas de backend réel
            showSummary(phone, offer, paymentMethod, total);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Continuer";
        }
    });

    function showSummary(phone, offer, paymentMethod, total) {
        const clientSummary = `
========================================
       MAKBINE - RÉCAPITULATIF CLIENT
========================================
Compte / Bénéficiaire : ${phone}
----------------------------------------
Forfait Précis        : ${offer.title}
Validité              : ${offer.validity}
Montant Brut          : ${offer.price} FCFA
Moyen de paiement     : ${paymentMethod}
Total (+7% frais)     : ${total.toFixed(2)} FCFA
----------------------------------------
Statut                : Validé & Envoyé sur Telegram
========================================
        `.trim();

        summaryPre.style.display = 'block';
        summaryPre.textContent = clientSummary;
        alert("Transaction validée et récapitulatif généré !");
    }

    // Initialisation au chargement
    updateOffers();
</script>

</body>
</html>
