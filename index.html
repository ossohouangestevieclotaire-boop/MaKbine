<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabine Express</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; font-size: 16px; }
        .app-container { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px; padding: 20px; margin: auto; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { color: var(--accent); margin: 0; font-size: 22px; }
        .user-badge { background: #334155; padding: 8px 12px; border-radius: 50px; font-size: 13px; display: flex; align-items: center; }
        .active-account { background: #0f172a; border: 1px solid var(--border); padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; }
        .active-account span { color: var(--accent); font-weight: bold; }
        .grid-services { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .service-card { background: #0f172a; border: 1px solid var(--border); padding: 16px; border-radius: 14px; text-align: center; cursor: pointer; transition: 0.2s; }
        .service-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .form-section { background: #0f172a; border: 1px solid var(--border); padding: 15px; border-radius: 14px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #1e293b; color: var(--text-main); box-sizing: border-box; }
        .btn-main { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main:hover { opacity: 0.9; }
        .hidden { display: none; }
        .back-link { color: var(--text-muted); font-size: 13px; cursor: pointer; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HEADER -->
    <div class="header">
        <h2>Cabine Express</h2>
        <div class="user-badge" onclick="toggleView('history')">Historique</div>
    </div>

    <!-- ACCUEIL / SERVICES -->
    <div id="home-view">
        <div class="grid-services">
            <div class="service-card" onclick="selectService('Transfert d\'unités')">
                <span>Transfert d'unités</span>
            </div>
            <div class="service-card" onclick="selectService('Souscription Internet')">
                <span>Souscription Internet</span>
            </div>
        </div>
    </div>

    <!-- FORMULAIRE -->
    <div id="form-view" class="hidden">
        <span class="back-link" onclick="toggleView('home')">← Retour</span>
        <h3 id="form-title" style="color: var(--accent); margin-top: 0;"></h3>
        
        <div class="form-section">
            <div class="form-group">
                <label>Numéro du bénéficiaire</label>
                <input type="text" id="dest-phone" placeholder="Ex: 0700000000" maxlength="10">
            </div>
            <div class="form-group" id="container-amount-input">
                <label>Montant en FCFA</label>
                <input type="number" id="amount-input" placeholder="Ex: 1000">
            </div>
            <button class="btn-main" onclick="openSummary()">Continuer</button>
        </div>
    </div>

    <!-- RÉCAPITULATIF -->
    <div id="summary-view" class="hidden">
        <span class="back-link" onclick="toggleView('form')">← Modifier</span>
        <h3 style="color: var(--accent); margin-top: 0;">Récapitulatif</h3>
        <div class="form-section">
            <p><strong>Service :</strong> <span id="sum-service"></span></p>
            <p><strong>Bénéficiaire :</strong> <span id="sum-phone"></span></p>
            <p><strong>Total à payer (avec frais) :</strong> <span id="sum-total"></span> FCFA</p>
            <button id="pay-btn" class="btn-main" onclick="lancerPaiementEtRedirection()">Valider et notifier Telegram</button>
        </div>
    </div>

    <!-- HISTORIQUE -->
    <div id="history-view" class="hidden">
        <span class="back-link" onclick="toggleView('home')">← Retour</span>
        <h3 style="color: var(--accent); margin-top: 0;">Historique des commandes</h3>
        <div id="history-container"></div>
    </div>
</div>

<script>
    let currentService = "";
    let transactions = JSON.parse(localStorage.getItem('cabine_history')) || [];

    function toggleView(viewName) {
        document.getElementById('home-view').classList.add('hidden');
        document.getElementById('form-view').classList.add('hidden');
        document.getElementById('summary-view').classList.add('hidden');
        document.getElementById('history-view').classList.add('hidden');

        if (viewName === 'home') document.getElementById('home-view').classList.remove('hidden');
        if (viewName === 'form') document.getElementById('form-view').classList.remove('hidden');
        if (viewName === 'summary') document.getElementById('summary-view').classList.remove('hidden');
        if (viewName === 'history') {
            renderHistory();
            document.getElementById('history-view').classList.remove('hidden');
        }
    }

    function selectService(name) {
        currentService = name;
        document.getElementById('form-title').innerText = name;
        document.getElementById('dest-phone').value = '';
        document.getElementById('amount-input').value = '';
        toggleView('form');
    }

    function openSummary() {
        const destPhone = document.getElementById('dest-phone').value.trim();
        const baseAmount = parseInt(document.getElementById('amount-input').value) || 0;

        if (!destPhone || baseAmount <= 0) {
            alert("Veuillez remplir tous les champs correctement.");
            return;
        }

        const total = baseAmount + Math.round(baseAmount * 0.07);

        document.getElementById('sum-service').innerText = currentService;
        document.getElementById('sum-phone').innerText = destPhone;
        document.getElementById('sum-total').innerText = total;

        toggleView('summary');
    }

    // Fonction sécurisée qui appelle votre backend Vercel pour envoyer sur Telegram
    async function sendTelegramNotification(phone, total) {
        try {
            const response = await fetch('/api/transacter', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    phone: phone, 
                    total: total 
                })
            });

            const data = await response.json();
            if (!data.success) {
                console.error("Erreur Telegram:", data.error);
            }
        } catch (error) {
            console.error("Erreur réseau lors de l'envoi Telegram:", error);
        }
    }

    async function lancerPaiementEtRedirection() {
        const destPhone = document.getElementById('sum-phone').innerText;
        const total = document.getElementById('sum-total').innerText;

        // Appel de la notification Telegram via votre API Vercel
        await sendTelegramNotification(destPhone, total);

        // Enregistrement dans l'historique local
        transactions.unshift({
            id: 'TX-' + Date.now(),
            service: currentService,
            phone: destPhone,
            total: total,
            date: new Date().toLocaleString(),
            status: 'Succès'
        });
        localStorage.setItem('cabine_history', JSON.stringify(transactions));

        alert("Transaction validée et notification envoyée sur Telegram !");
        toggleView('home');
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = '';
        if (transactions.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Aucune commande enregistrée.</p>';
            return;
        }
        transactions.forEach(tx => {
            const item = document.createElement('div');
            item.style.background = '#0f172a';
            item.style.border = '1px solid #334155';
            item.style.padding = '10px';
            item.style.borderRadius = '8px';
            item.style.marginBottom = '8px';
            item.innerHTML = `<strong>${tx.service}</strong><br><span style="font-size:12px; color:var(--text-muted);">Tél: ${tx.phone} | Total: ${tx.total} FCFA</span><br><small style="color:#10b981;">${tx.status}</small>`;
            container.appendChild(item);
        });
    }
</script>

</body>
</html>
