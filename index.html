<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabine Express</title>
    <!-- Styles inchangés -->
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .app-container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 15px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        .btn-main { width: 100%; background: #f97316; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <h3>Cabine Express</h3>
    <div id="form-view">
        <label>Service</label>
        <select id="service-select">
            <option>Transfert d'unités</option>
            <option>Souscription Internet</option>
        </select>
        <label>Numéro bénéficiaire</label>
        <input type="text" id="dest-phone" placeholder="0700000000">
        <label>Montant (FCFA)</label>
        <input type="number" id="amount" placeholder="500">
        <button class="btn-main" onclick="validerTransactionFinale()">Payer avec Wave</button>
    </div>
</div>

<script>
    function validerTransactionFinale() {
        const phone = document.getElementById('dest-phone').value.trim();
        const amount = document.getElementById('amount').value.trim();
        const service = document.getElementById('service-select').value;

        if(!phone || !amount) { alert("Remplissez tous les champs"); return; }

        // Redirection vers le serveur avec les données dans l'URL
        const url = `/api/transacter?phone=${phone}&montant=${amount}&service=${encodeURIComponent(service)}`;
        window.location.href = url;
    }
</script>

</body>
</html>
